      sc.appendChild(r);
    });
    // 근로기준법 쟁점이 없고 제11조만 남은 경우(다른 법령 주제)에는 이 카드를 숨긴다
    var onlyEleven = !(a.primary.length || a.keys.some(function (k) { return k !== "11" && LAW[k]; }));
    if (!onlyEleven) res.appendChild(sc);

    // 근로기준법 외 관련 법령: 적용 범위 원문과 관련 조문
    a.xl.forEach(function (n) {
      var m = XS[n], bd = XBADGE[n] || [["원문 확인", "warn"], ["원문 확인", "warn"]], b = size === "small" ? bd[0] : bd[1];
      var c = section(xShort(n) + " 적용 여부", "국가법령정보센터 원문 기준 (시행 " + XL[n].since + ")");
      var r = el("div", "row"), l = el("div", "l"); l.appendChild(el("b", null, n)); r.appendChild(l); r.appendChild(el("span", "pill " + b[1], b[0])); c.appendChild(r);
      if (m) c.appendChild(el("div", "body", m.note));
      // 기간제법: 4인 이하 사업장에서 조문별 적용 여부 (시행령 별표 1 대조)
      if (n === GIGAN && size === "small") {
        c.appendChild(el("p", "note", "시행령 별표 1과 대조한 조문별 적용 여부"));
        ["4", "5", "6", "7", "8", "9"].forEach(function (k) {
          var ar = xArt(n, k), gs = giganStatus(k); if (!ar || !gs) return;
          var rr = el("div", "row"), ll = el("div", "l"); ll.appendChild(el("b", null, "제" + k + "조 " + ar.t)); rr.appendChild(ll); rr.appendChild(el("span", "pill " + gs[1], gs[0])); c.appendChild(rr);
        });
      }
      ((m && m.scope) || []).forEach(function (s) {
        var ar = xArt(s[0], s[1]); if (!ar) return;
        var label = s[1].indexOf("별표") === 0 ? s[0] + " 별표 1" : s[0] + " 제" + s[1].replace("의", "조의") + (s[1].indexOf("의") < 0 ? "조" : "");
        c.appendChild(fold(label, ar.t, textNode(ar.x)));
      });
      var xt = []; a.topics.forEach(function (tp) { if (tp.xl.indexOf(n) >= 0) (tp.xterms || tp.terms).forEach(function (w) { if (xt.indexOf(w) < 0) xt.push(w); }); });
      var skip = {}; ((m && m.scope) || []).forEach(function (s) { if (s[0] === n) skip[s[1]] = 1; });
      xSearch(n, xt, 8).filter(function (h) { return !skip[h.a.k]; }).slice(0, 4).forEach(function (h) { c.appendChild(fold(xShort(n) + " 제" + h.a.k.replace("의", "조의") + (h.a.k.indexOf("의") < 0 ? "조" : ""), h.a.t, textNode(h.a.x))); });
      res.appendChild(c);
    });

    // 판례 · 해석
    var terms = [];
    kw.split(/[,\s·]+/).forEach(function (w) { if (w.length >= 2) terms.push(w); });
    a.topics.forEach(function (tp) {
      if (a.hasNotice && tp.id === "해고·징계해고") return;
      tp.terms.forEach(function (w) { if (terms.indexOf(w) < 0) terms.push(w); });
    });
    if (size === "small") terms.push("5인 미만", "상시 4");
    var prim = a.primary.filter(function (k) { return LAW[k] && k.indexOf("의") < 0; });
    var jos = a.topics.filter(function (tp) { return tp.jo; }).map(function (tp) { return tp.jo; });
    var precs = rank(D.prec, [["name", 3], ["issue", 2], ["gist", 2]], terms, prim, jos).slice(0, 5);
    var seen = {};
    var expcs = rank(D.expc, [["title", 3], ["q", 2], ["a", 2]], terms, []).filter(function (r) {
      var k = r.x.no + "|" + r.x.title; if (seen[k]) return false; seen[k] = 1; return true;
    }).slice(0, 5);

    var pc = section("관련 대법원 판례", "키워드와 참조조문이 일치하는 판결입니다. 쟁점에 정확히 맞는지는 요지를 읽고 판단하시기 바랍니다.");
    if (!precs.length) pc.appendChild(el("p", "note", "일치하는 판례가 없습니다."));
    precs.forEach(function (r) {
      var b = el("div");
      if (r.x.issue) { b.appendChild(el("h3", null, "판시사항")); b.appendChild(textNode(r.x.issue)); }
      if (r.x.gist) { b.appendChild(el("h3", null, "판결요지")); b.appendChild(textNode(r.x.gist)); }
      var p = el("p"); var an = el("a", null, "국가법령정보센터에서 보기"); an.href = "https://www.law.go.kr/LSW/precInfoP.do?precSeq=" + r.x.id; an.target = "_blank"; an.rel = "noopener"; p.appendChild(an); b.appendChild(p);
      pc.appendChild(fold(r.x.no + " | " + r.x.name, "대법원 " + r.x.date.replace(/^(\d{4})(\d\d)(\d\d)$/, "$1.$2.$3") + " 선고", b));
    });
    res.appendChild(pc);

    var ec = section("고용노동부 법령해석", "1999~2004년 문서는 옛 조문번호(예: 제32조)로 적혀 있습니다.");
    if (!expcs.length) ec.appendChild(el("p", "note", "일치하는 해석이 없습니다."));
    expcs.forEach(function (r) {
      var b = el("div"); if (r.x.q) { b.appendChild(el("h3", null, "질의요지")); b.appendChild(textNode(r.x.q)); }
      b.appendChild(el("h3", null, "회답")); b.appendChild(textNode(r.x.a));
      ec.appendChild(fold(r.x.title, r.x.no + " | " + r.x.date.replace(/^(\d{4})(\d\d)(\d\d)$/, "$1.$2.$3"), b));
    });
    res.appendChild(ec);

    // 조문 원문
    var ac = section("조문 원문");
    a.keys.forEach(function (k) {
      if (!LAW[k]) return;
      var d = fold("근로기준법 " + artLabel(k), LAW[k].title, textNode(LAW[k].text)); if (a.primary.indexOf(k) >= 0) d.open = true; ac.appendChild(d);
    });
    ["7", "7의2"].forEach(function (k) {
      if (DEC[k] && (size === "small" || k !== "7")) ac.appendChild(fold("시행령 " + artLabel(k), DEC[k].title, textNode(DEC[k].text)));
    });
    ac.appendChild(fold("시행령 별표 1", "4명 이하 사업장에 적용하는 법 규정", textNode(D.byl1)));
    res.appendChild(ac);

    // 종합 분석
    var an2 = section("종합 분석"), ul = el("ul", "pts");
    if (size === "small" && !onlyEleven) {
      var shown = a.keys.filter(function (k) { return LAW[k]; });
      var yes = shown.filter(function (k) { return status(k).code === "full"; }).map(artLabel);
      var no = shown.filter(function (k) { return status(k).code === "excluded"; }).map(artLabel);
      var part = shown.filter(function (k) { return status(k).code === "partial"; }).map(function (k) { return artLabel(k) + " " + status(k).detail; });
      var s = "5인 미만 사업장에 적용되는 규정은 시행령 별표 1이 정합니다.";
      if (yes.length) s += " 이 사례의 조문 중 " + listEunNeun(yes) + " 적용됩니다.";
      if (part.length) s += " " + part.join(", ") + "만 적용됩니다.";
      if (no.length) s += " " + listEunNeun(no) + " 별표 1에 없어 적용되지 않습니다.";
      ul.appendChild(el("li", null, s));
    }
    if (a.hasNotice && a.months != null) ul.appendChild(el("li", null, "입력에서 읽은 근무기간은 약 " + (Math.round(a.months * 10) / 10) + "개월입니다. 제26조 단서 제1호는 계속 근로기간 3개월 미만이면 예고와 수당을 면제합니다."));
    if (a.hasNotice && a.months == null) ul.appendChild(el("li", null, "입력에 근무기간이 없어 제26조 단서 제1호(3개월 미만) 해당 여부를 판단하지 못했습니다."));
    if (a.topics.some(function (t) { return t.id === "산업재해"; })) ul.appendChild(el("li", null, "산재보험 급여의 승인과 지급은 산업재해보상보험법이 정하는 별도 법률의 영역이라 이 페이지가 법 조문을 직접 대조하지 않습니다. 근로기준법 제8장 재해보상은 사용자의 직접 보상 책임을 다루며, 판례는 산업재해보상보험법을 참조한 대법원 판결을 포함해 찾았습니다."));
    ul.appendChild(el("li", null, "상시 근로자 수는 시행령 제7조의2에 따라 산정기간의 연인원을 가동일수로 나누어 정합니다. 4인과 5인의 경계라면 이 산정식으로 다시 확인하시기 바랍니다."));
    ul.appendChild(el("li", null, "이 결과는 검색과 별표 1 대조에 기반한 자동 사전 판정입니다. 사실관계를 반영한 최종 법리 판단은 하단의 Claude 요청문으로 받으시기 바랍니다."));
    an2.appendChild(ul); res.appendChild(an2);

    lastPrompt = buildPrompt(kw, text, a, v, precs, expcs);
    var pcard = section("Claude 판정 요청문", "근거 조문, 적용 여부, 판례와 해석 후보를 담았습니다. Claude에 붙여 넣으시면 종합 분석을 받을 수 있습니다.");
    var ta = el("textarea", "pbox"); ta.id = "pbox"; ta.readOnly = true; ta.value = lastPrompt; pcard.appendChild(ta);
    res.appendChild(pcard);
    res.appendChild(el("p", "foot", "참고용 정보이며 법률 자문이 아닙니다. 실제 분쟁은 노동청 또는 공인노무사와 상담하시기 바랍니다."));
  }

  // 입력 화면
  function setSize(s) { size = s; $("o-small").setAttribute("aria-pressed", s === "small"); $("o-large").setAttribute("aria-pressed", s === "large"); }
  $("o-small").onclick = function () { setSize("small"); };
  $("o-large").onclick = function () { setSize("large"); };
  var chipBox = $("chips");
  CHIPS.forEach(function (c) {
    var b = el("button", "chip", c); b.type = "button"; b.setAttribute("aria-pressed", "false");
    b.onclick = function () {
      var on = b.getAttribute("aria-pressed") !== "true";
      Array.prototype.forEach.call(chipBox.children, function (x) { x.setAttribute("aria-pressed", "false"); });
      b.setAttribute("aria-pressed", on ? "true" : "false"); topic = on ? c : "";
    };
    chipBox.appendChild(b);
  });
  var ta = $("case"), go = $("go");
  function sync() { go.disabled = !ta.value.trim(); }
  ta.addEventListener("input", sync);
  $("ex").onclick = function () {
    ta.value = "상시 근로자 4명인 사업장에서 2개월 근무한 직원을 당일 해고하면서 해고예고수당을 지급하지 않았습니다. 근로기준법 위반인지 알고 싶습니다.";
    setSize("small");
    Array.prototype.forEach.call(chipBox.children, function (x) { var on = x.textContent === "해고예고수당"; x.setAttribute("aria-pressed", on ? "true" : "false"); if (on) topic = x.textContent; });
    sync();
  };
  function show(two) {
    $("s1").hidden = two; $("cta1").hidden = two; $("s2").hidden = !two; $("cta2").hidden = !two;
    window.scrollTo(0, 0);
  }
  go.onclick = function () { render(topic, ta.value.trim()); show(true); };
  $("back").onclick = function () { show(false); };
  $("back2").onclick = function () { show(false); };
  $("copy").onclick = function () {
    var b = $("copy"), box = $("pbox");
    function done(ok) { b.textContent = ok ? "복사했습니다" : "요청문을 직접 복사해 주세요"; if (!ok && box) { box.scrollIntoView({ block: "center" }); box.select(); } }
    var ok = false;
    try { if (box) { box.select(); ok = document.execCommand("copy"); } } catch (e) {}
    if (ok) return done(true);
    if (navigator.clipboard) navigator.clipboard.writeText(lastPrompt).then(function () { done(true); }, function () { done(false); }); else done(false);
  };
  sync();
}
(function () {
  if (DATA) { start(DATA); return; }
  var b = document.getElementById("built");
  function get(n) { return fetch("data/" + n + ".json").then(function (r) { if (!r.ok) throw new Error(n); return r.json(); }); }
  Promise.all([get("law"), get("prec"), get("expc")]).then(function (a) {
    start({ built: a[0].built, laws: a[0].laws, byl1: a[0].byl1, xlaws: a[0].xlaws, xscope: a[0].xscope, prec: a[1], expc: a[2] });
  }).catch(function () { b.textContent = "데이터를 불러오지 못했습니다. 새로고침해 주시기 바랍니다."; });
})();
</script>
</body>
